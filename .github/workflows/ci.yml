name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPINEL_REF: 519280dc9edd136186c0b0767fb73766b6e45aba

jobs:
  linux:
    name: linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kiln-corpus
          key: kiln-corpus-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            kiln-corpus-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SPINEL_REF=${{ env.SPINEL_REF }}
          load: true
          tags: kiln-ci:${{ matrix.arch }}
          cache-from: type=gha,scope=kiln-ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kiln-ci-${{ matrix.arch }}

      - name: Run CI in the image
        run: |
          mkdir -p "$RUNNER_TEMP/kiln-ci"
          mkdir -p "$RUNNER_TEMP/kiln-corpus"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPINEL_WORKERS=1 \
            -e CI_NATIVE_C=1 \
            -e KILN_NATIVE_CC=clang-18 \
            -e KILN_C_CORPUS=/corpus \
            -e KILN_ARTIFACTS=/artifacts \
            -e TEST_TIMEOUT=60 \
            -e KILN_FUZZ_SECONDS=2 \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/kiln-corpus:/corpus" \
            -v "$RUNNER_TEMP/kiln-ci:/artifacts" \
            kiln-ci:${{ matrix.arch }} ci/run.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-ci-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/kiln-ci
          if-no-files-found: ignore
          retention-days: 7
