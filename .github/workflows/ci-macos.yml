name: CI macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPINEL_WORKERS: 1

jobs:
  macos:
    name: macos/arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Determine Homebrew LLVM cache key
        id: llvm-cache
        run: |
          fingerprint=$(brew info --json=v2 llvm lld | shasum -a 256 | cut -c1-16)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: homebrew-llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm-cache.outputs.fingerprint }}
          restore-keys: |
            homebrew-llvm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native dependencies
        env:
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
        run: brew install llvm lld pkg-config libffi libpq mariadb-connector-c openssl@3 wrk

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kiln-corpus
          key: kiln-corpus-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            kiln-corpus-${{ runner.os }}-${{ runner.arch }}-

      - name: Fingerprint toolchains
        id: toolchain
        run: |
          printf 'spinel=%s\n' "$(ci/build-spinel.sh --fingerprint)" >> "$GITHUB_OUTPUT"
          printf 'mariadb=%s\n' "$(ci/build-mariadb.sh --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore Spinel
        id: spinel-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/spinel
          key: kiln-spinel-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.spinel }}

      - name: Restore Connector/C
        id: mariadb-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/mariadb
          key: kiln-mariadb-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.mariadb }}

      - name: Build Spinel
        run: |
          if ! ci/build-spinel.sh --check >/dev/null; then
            rm -rf .tools/spinel
            ci/build-spinel.sh
          fi

      - name: Save Spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/spinel
          key: kiln-spinel-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.spinel }}

      - name: Build Connector/C
        run: |
          if ! ci/build-mariadb.sh --check >/dev/null; then
            rm -rf .tools/mariadb
            ci/build-mariadb.sh
          fi

      - name: Save Connector/C
        if: steps.mariadb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/mariadb
          key: kiln-mariadb-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.mariadb }}

      - name: Run CI natively
        run: |
          mkdir -p "$RUNNER_TEMP/kiln-ci"
          SPINEL_CC="cc -Wno-nullability-completeness" \
          SPINEL_WORKERS=1 \
          CI_NATIVE_C=1 \
          KILN_NATIVE_CC="$(brew --prefix llvm)/bin/clang" \
          KILN_NATIVE_LDFLAGS=-fuse-ld=lld \
          KILN_C_CORPUS="$RUNNER_TEMP/kiln-corpus" \
          LLVM_PROFDATA="$(brew --prefix llvm)/bin/llvm-profdata" \
          LLVM_COV="$(brew --prefix llvm)/bin/llvm-cov" \
          KILN_ARTIFACTS="$RUNNER_TEMP/kiln-ci" \
          PKG_CONFIG_PATH="$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mariadb-connector-c)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
          TEST_TIMEOUT=60 \
          KILN_FUZZ_SECONDS=2 \
            ci/run.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-ci-macos-arm64
          path: ${{ runner.temp }}/kiln-ci
          if-no-files-found: ignore
          retention-days: 7
