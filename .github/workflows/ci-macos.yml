name: CI macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPINEL_REF: 519280dc9edd136186c0b0767fb73766b6e45aba
  SPINEL_WORKERS: 1

jobs:
  macos:
    name: macos/arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Determine Homebrew LLVM cache key
        id: llvm-cache
        run: |
          fingerprint=$(brew info --json=v2 llvm lld | shasum -a 256 | cut -c1-16)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/homebrew-cache/downloads
          key: homebrew-llvm-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm-cache.outputs.fingerprint }}
          restore-keys: |
            homebrew-llvm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native dependencies
        env:
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
        run: brew install llvm lld pkg-config libffi openssl@3 wrk

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kiln-corpus
          key: kiln-corpus-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            kiln-corpus-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Spinel
        id: spinel-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spinel-install
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}

      - name: Build Spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/matz/spinel.git "$RUNNER_TEMP/spinel"
          git -C "$RUNNER_TEMP/spinel" checkout "$SPINEL_REF"
          make -C "$RUNNER_TEMP/spinel" deps
          make -C "$RUNNER_TEMP/spinel" -j1
          make -C "$RUNNER_TEMP/spinel" install PREFIX="$RUNNER_TEMP/spinel-install"

      - name: Run CI natively
        run: |
          mkdir -p "$RUNNER_TEMP/kiln-ci"
          SPINEL="$RUNNER_TEMP/spinel-install/bin/spinel" \
          SPINEL_CC="cc -Wno-nullability-completeness" \
          SPINEL_WORKERS=1 \
          CI_NATIVE_C=1 \
          KILN_NATIVE_CC="$(brew --prefix llvm)/bin/clang" \
          KILN_NATIVE_LDFLAGS=-fuse-ld=lld \
          KILN_C_CORPUS="$RUNNER_TEMP/kiln-corpus" \
          LLVM_PROFDATA="$(brew --prefix llvm)/bin/llvm-profdata" \
          LLVM_COV="$(brew --prefix llvm)/bin/llvm-cov" \
          KILN_ARTIFACTS="$RUNNER_TEMP/kiln-ci" \
          TEST_TIMEOUT=180 \
            ci/run.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-ci-macos-arm64
          path: ${{ runner.temp }}/kiln-ci
          if-no-files-found: ignore
          retention-days: 7
